[project]
name = "siapquiz-api"
version = "0.1.0"
description = "SiapQuiz API — FastAPI + arq worker (Python 3.12)"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "pydantic~=2.9",
    "pydantic-settings~=2.6",
    "sqlalchemy[asyncio]~=2.0",
    "asyncpg~=0.30",
    "alembic~=1.14",
    "arq~=0.26",
    "redis~=5.2",
    "structlog~=24.4",
    "httpx~=0.27",
    "argon2-cffi~=23.1",
    "pyjwt[crypto]~=2.10",
    "slowapi~=0.1.9",
    "email-validator~=2.2",
]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "pytest-cov~=6.0",
    "ruff~=0.8",
    "mypy~=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true

# Logika inti wajib bertipe lengkap (coding-standard.md §3.8)
[[tool.mypy.overrides]]
module = ["app.services.*", "app.llm.*", "app.mcq.*", "app.rag.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
